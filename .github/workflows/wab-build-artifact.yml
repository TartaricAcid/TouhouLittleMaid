name: WAB Build Artifact 1.21 (no release)

# 只做「构建 + 存成 artifact」，不打 tag、不发 Release，也不碰上游那条 gradle-publish-1.21.yml。
# 给 ci/** 分支自动跑一次；另外带一个真开服的兼容冒烟测试，专门验「换 jar 之后附属模组还能起来」。
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'gradle'

      # T01 门禁：配置目录 ↔ 三份 Java 生成物必须逐字节一致，默认值与保守规则不能被手改破坏。
      - name: Verify config catalog
        run: python3 tools/wab_config/verify_config_catalog.py --root .

      - name: Build jar
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon --stacktrace

      - name: Game test server (drop-in check)
        continue-on-error: true
        run: |
          ./gradlew runGameTestServer --no-daemon --stacktrace

      # 1.21 用的 ModDevGradle 把 gameTestServer 的 run 目录单独放在 run/gameTestServer，
      # 上一次在 1.20 分支按 run/logs 取日志所以取到的是空目录。
      - name: Upload game test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-log
          path: |
            build/gameTestOutput/**
            run/gameTestServer/logs/**
            run/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: wab-maid-bridge-jar-1.21
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  # ==========================================================
  # 兼容冒烟测试：换上我们的 jar，连着上游那批附属模组真开一次服务端。
  # 失败不影响上面的编译结论（continue-on-error），但它过了才算真的能装。
  # ==========================================================
  compat-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: wab-maid-bridge-jar-1.21
          path: run/mods

      # 1.21 的 build.gradle 把默认 jar 任务关了（jar { enabled = false }），
      # 能装进服务端的只有 shadowJar 产出的 -all.jar——上游自己的发布流程也是取它。
      # 所以这里反过来：留 -all，删源码包；万一哪天 -all 没了，才退回薄 jar。
      - name: Keep the installable mod jar
        run: |
          cd run/mods
          ls -la
          find . -name '*-sources.jar' -delete
          find . -name '*-dev.jar' -delete
          find . -name '*-deobf.jar' -delete
          if ls ./*-all.jar >/dev/null 2>&1; then
            find . -name '*.jar' ! -name '*-all.jar' -delete
          else
            find . -name '*-all.jar' -delete
          fi
          ls -la
          test "$(find . -name '*.jar' | wc -l)" = "1"

      - name: Download dependency mods from Modrinth
        run: python3 .github/script/download_modrinth_mod.py

      - name: Server smoke test
        uses: headlesshq/mc-server-test@1.1.1
        with:
          mc: '1.21.1'
          modloader: neoforge
          java: 21

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-smoke-test-log
          path: |
            **/logs/latest.log
            **/server.log
          if-no-files-found: ignore
          retention-days: 7
