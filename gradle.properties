# 区分靠版本号后缀和 displayName，装错/装重了在模组列表和「重复 modId」报错里都看得出来。
mod_name=Touhou Little Maid (WAB bridge)
mod_license=MIT / CC BY-NC-SA 4.0
mod_version=1.5.3-neoforge+mc1.21.1-wab.1
mod_group_id=com.github.tartaricacid
mod_authors=TartaricAcid, Snownee, Succinum, Pajinyi, Zhi_Ban, CrystalizedSun, Foky, ZeniCrow, Paulzzh, Yuriscat, Lappland162
mod_description=Unofficial branch of Touhou Little Maid with the WarmAsBefore (WAB) AI maid bridge. Same modId, registry names and gameplay as upstream, so it is a drop-in replacement for the official jar. Upstream code and assets stay with their original authors under MIT / CC BY-NC-SA 4.0: https://github.com/TartaricAcid/TouhouLittleMaid
