modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/gongchanwangzilin/TouhouLittleMaid-WAB/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    # updateJSONURL="https://change.me.example.invalid/updates.json"
    displayURL = "https://github.com/gongchanwangzilin/TouhouLittleMaid-WAB"
    logoFile = "logo.png"
    credits = "Verclene, ZUN, WarmAsBefore (WAB bridge)"
    authors = "${mod_authors}"
    description = '''${mod_description}'''

[[mixins]]
    config = "${mod_id}.mixins.json"

[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"

[modproperties.touhou_little_maid]
    catalogueItemIcon = "touhou_little_maid:hakurei_gohei"

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "kubejs"
    type="optional"
    versionRange = "[2101.7.2-build.309,)"
    ordering = "NONE"
    side = "BOTH"