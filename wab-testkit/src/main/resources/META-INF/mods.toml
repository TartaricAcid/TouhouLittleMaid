[[mods]]
modId = "wab_testkit"
version = "1.0"
displayName = "WAB Bridge Testkit (临时)"
description = '''临时用的链路测试模组：在游戏里假装成 WarmAsBefore 宿主，
把车万女仆 WAB 桥的所有外界入口按一遍——UDP 发现、HMAC 配对、TCP 握手、
每一帧入站消息、每一条命令的成功与失败分支、世界事件、拍照、语音，
最后逐条打 PASS/FAIL/SKIP。测完请把这个 jar 从 mods/ 里删掉。'''

[[dependencies.wab_testkit]]
modId = "forge"
mandatory = true
versionRange = "[47.2.0,)"
